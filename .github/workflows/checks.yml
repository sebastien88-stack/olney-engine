name: Project checks

on:
  push:
    branches: [main, 'community/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows Python 3.12 checks
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile project Python
        run: python tools/check_python.py
      - name: Run regression tests
        run: python -m pytest tests -q -m "not ui"
      - name: Validate interpretation corpus
        run: python tools/validate_interpretation.py
      - name: Check tracked files and Git history for credential patterns
        run: python tools/audit_public_repository.py
      - name: Start the application with an isolated database
        run: python tools/ui_startup_smoke.py

  ui:
    name: Windows Tk UI journeys
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated UI journeys
        run: python -m pytest tests -q -m ui
