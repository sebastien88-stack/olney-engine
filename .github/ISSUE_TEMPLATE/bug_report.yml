name: Bug report
description: Report a reproducible application or calculation problem.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Use synthetic inputs. Do not include API keys, personal databases or private conversations. For vulnerabilities, follow SECURITY.md.'
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Olney version, Windows version, installer or source; Python version for source runs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include synthetic inputs and the relevant view/cycle.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: For calculation differences, include the rule or reference used.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error details (optional)
      description: Remove names, identifying birth details and credentials before sharing.
